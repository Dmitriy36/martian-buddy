<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search - Martian Buddy</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/global-search.js"></script>
    <style>
      .search-box {
        width: 100%;
        padding: 15px;
        font-size: 1.2em;
        background-color: #2a2a2a;
        border: 2px solid #ff4444;
        color: #f0f0f0;
        margin: 20px 0;
        box-sizing: border-box;
      }
      .search-results {
        margin-top: 30px;
      }
      .search-result {
        background-color: #2a2a2a;
        padding: 20px;
        margin: 15px 0;
        border-left: 4px solid #ff4444;
      }
      .search-result h3 {
        margin: 0 0 10px 0;
      }
      .search-result a {
        color: #66ccff;
        text-decoration: none;
        font-size: 1.2em;
      }
      .search-result a:hover {
        text-decoration: underline;
      }
      .search-result p {
        color: #ccc;
        margin: 10px 0 0 0;
      }
      .no-results {
        color: #999;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <a href="/index.html">← Back to Home</a>

    <h1>🔍 Search Results</h1>

    <input
      type="text"
      id="search-input"
      class="search-box"
      placeholder="Search for levels, weapons, codes, enemies..."
      autofocus
    />

    <div id="search-results" class="search-results"></div>

    <script src="/js/search-index.js"></script>
    <script>
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");

      // Check if there's a query parameter in the URL
      const urlParams = new URLSearchParams(window.location.search);
      const initialQuery = urlParams.get("q");
      if (initialQuery) {
        searchInput.value = initialQuery;
        performSearch(initialQuery);
      }

      // Live search as user types
      let searchTimeout;
      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          performSearch(e.target.value);
        }, 300);
      });

      function performSearch(query) {
        if (!query || query.trim().length < 2) {
          searchResults.innerHTML =
            '<p class="no-results">Enter at least 2 characters to search.</p>';
          return;
        }

        const results = searchPages(query);

        if (results.length === 0) {
          searchResults.innerHTML =
            '<p class="no-results">No results found for "' +
            escapeHtml(query) +
            '"</p>';
          return;
        }

        searchResults.innerHTML =
          `<p style="color: #66ccff; margin-bottom: 20px;">Found ${
            results.length
          } result${results.length === 1 ? "" : "s"}:</p>` +
          results
            .map(
              (result) => `
                <div class="search-result">
                    <h3><a href="${result.url}">${escapeHtml(
                result.title
              )}</a></h3>
                    <p>${escapeHtml(result.snippet)}</p>
                </div>
            `
            )
            .join("");
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
