<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Martian Buddy — SC2 Co-op Log</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /* ── Variables ── */
  :root {
    --bg:        #0a0c10;
    --surface:   #111520;
    --border:    #1e2d45;
    --accent:    #00d4ff;
    --accent2:   #ff4d6d;
    --dim:       #3a5068;
    --text:      #c8dde8;
    --text-dim:  #4a6a80;
    --green:     #00ff9f;
    --font-head: 'Orbitron', monospace;
    --font-mono: 'Share Tech Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* ── Header ── */
  header {
    padding: 2.5rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .header-glow {
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 120px;
    background: radial-gradient(ellipse, rgba(0,212,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 420px;
  }

  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--dim);
    font-size: 1.1rem;
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 0.55rem 0.8rem 0.55rem 2.2rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="search"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  .stat-pills {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .pill {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.3rem 0.75rem;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .pill span {
    color: var(--accent);
    font-weight: bold;
  }

  /* ── Table ── */
  .table-wrap {
    padding: 1.5rem 2rem 4rem;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    border-bottom: 2px solid var(--border);
  }

  th {
    font-family: var(--font-head);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0.6rem 0.8rem;
    text-align: left;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover { color: var(--accent); }

  th.sort-asc::after  { content: ' ▲'; color: var(--accent); }
  th.sort-desc::after { content: ' ▼'; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid rgba(30,45,69,0.5);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(0,212,255,0.03); }

  td {
    padding: 0.55rem 0.8rem;
    vertical-align: middle;
  }

  .td-name {
    color: var(--accent);
    font-weight: bold;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .td-date {
    color: var(--text-dim);
    white-space: nowrap;
    font-size: 0.78rem;
  }

  .td-map {
    color: var(--text);
    font-size: 0.78rem;
  }

  .td-region {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 0.15rem 0.45rem;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .td-region.us { color: #00d4ff; border-color: rgba(0,212,255,0.3); }
  .td-region.eu { color: #ffd166; border-color: rgba(255,209,102,0.3); }
  .td-region.kr { color: #ff4d6d; border-color: rgba(255,77,109,0.3); }

  select#region-filter {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 0.5rem 0.7rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  select#region-filter:focus { border-color: var(--accent); }

  .td-notes {
    width: 100%;
    min-width: 200px;
  }

  /* ── Inline note editor ── */
  .note-field {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    width: 100%;
    padding: 0.2rem 0.3rem;
    transition: border-color 0.2s, background 0.2s;
    border-radius: 2px;
    resize: none;
    overflow: hidden;
    min-height: 1.5em;
  }

  .note-field:hover {
    border-bottom-color: var(--dim);
  }

  .note-field:focus {
    outline: none;
    background: var(--surface);
    border-bottom-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(0,212,255,0.1);
  }

  .note-field.saving {
    border-bottom-color: var(--green);
    color: var(--green);
  }

  .note-field.saved {
    border-bottom-color: var(--green);
  }

  /* ── Empty / loading states ── */
  .state-msg {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .state-msg .big {
    font-family: var(--font-head);
    font-size: 1.1rem;
    color: var(--dim);
    margin-bottom: 0.6rem;
  }

  /* ── Loader ── */
  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── highlight matched text ── */
  mark {
    background: rgba(0,212,255,0.2);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── Footer ── */
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 0.5rem 2rem;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-size: 0.68rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.1em;
  }

  #last-synced {
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  #last-synced span { color: var(--accent); }

  #save-status {
    color: var(--green);
    opacity: 0;
    transition: opacity 0.4s;
  }

  #save-status.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-glow"></div>
  <h1>Martian Buddy // SC2 Co-op Log</h1>
  <p class="subtitle">Personal field notes on allied commanders</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Search player name..." autocomplete="off" />
  </div>
  <select id="region-filter">
    <option value="">All Regions</option>
    <option value="us">NA</option>
    <option value="eu">EU</option>
    <option value="kr">KR</option>
  </select>
  <div class="stat-pills">
    <div class="pill">Matches: <span id="stat-matches">—</span></div>
    <div class="pill">Players: <span id="stat-players">—</span></div>
    <div class="pill">Showing: <span id="stat-showing">—</span></div>
  </div>
</div>

<div class="table-wrap">
  <div id="state" class="state-msg">
    <div class="big"><span class="loader"></span> Establishing uplink...</div>
    Loading match records from Supabase.
  </div>
  <table id="main-table" style="display:none;">
    <thead>
      <tr>
        <th data-col="player_name">Player</th>
        <th data-col="match_date" class="sort-desc">Date</th>
        <th data-col="map_name">Map</th>
        <th data-col="region">Region</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<footer>
  <span>martian-buddy.com // sc2 coop log</span>
  <span id="last-synced">Last synced: <span>—</span></span>
  <span id="save-status">✓ note saved</span>
</footer>

<script>
// ── CONFIG — replace these two values ────────────────────────────────────────
const SUPABASE_URL = "https://ewztgzyqrgvhgmbaldgn.supabase.co";   // ← replace
const SUPABASE_KEY = "sb_publishable_7vr3dnvPPCn4JKMUQVrTYw_1DDR0lX9";                      // ← replace
// ─────────────────────────────────────────────────────────────────────────────

const PAGE_SIZE = 500; // fetch in chunks

let allRows   = [];   // full dataset
let sortCol   = "match_date";
let sortDir   = "desc";
let saveTimer = null;

// ── Supabase fetch (no SDK needed — plain REST) ──────────────────────────────
async function fetchAll() {
  let rows = [];
  let from = 0;
  while (true) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/coop_matches?select=id,player_name,match_date,map_name,region,notes&order=player_name.asc,match_date.desc&offset=${from}&limit=${PAGE_SIZE}`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const chunk = await res.json();
    rows = rows.concat(chunk);
    if (chunk.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }
  return rows;
}

async function saveNote(id, notes) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/coop_matches?id=eq.${id}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({ notes })
    }
  );
  if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}`);
}

// ── Render ───────────────────────────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(escaped, "gi"), m => `<mark>${m}</mark>`);
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function sortRows(rows) {
  return [...rows].sort((a, b) => {
    let av = a[sortCol] ?? "";
    let bv = b[sortCol] ?? "";
    if (sortCol === "match_date") {
      av = new Date(av); bv = new Date(bv);
    } else {
      av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
    }
    if (av < bv) return sortDir === "asc" ? -1 :  1;
    if (av > bv) return sortDir === "asc" ?  1 : -1;
    return 0;
  });
}

function render(query = "") {
  const q      = query.trim().toLowerCase();
  const region = document.getElementById("region-filter").value.toLowerCase();

  const filtered = allRows.filter(r => {
    const nameMatch   = !q      || r.player_name?.toLowerCase().includes(q);
    const regionMatch = !region || (r.region ?? "").toLowerCase() === region;
    return nameMatch && regionMatch;
  });

  const sorted = sortRows(filtered);

  const uniquePlayers = new Set(allRows.map(r => r.player_name)).size;
  document.getElementById("stat-matches").textContent  = allRows.length.toLocaleString();
  document.getElementById("stat-players").textContent  = uniquePlayers.toLocaleString();
  document.getElementById("stat-showing").textContent  = filtered.length.toLocaleString();

  const tbody = document.getElementById("tbody");

  if (sorted.length === 0) {
    document.getElementById("main-table").style.display = "none";
    document.getElementById("state").style.display = "";
    document.getElementById("state").innerHTML =
      `<div class="big">NO SIGNAL</div>No records match your filters.`;
    return;
  }

  document.getElementById("state").style.display = "none";
  document.getElementById("main-table").style.display = "";

  tbody.innerHTML = sorted.map(row => {
    const regionVal = (row.region ?? "Unknown").toLowerCase();
    const regionClass = ["us","eu","kr"].includes(regionVal) ? regionVal : "";
    return `
    <tr data-id="${row.id}">
      <td class="td-name">${highlight(row.player_name, query)}</td>
      <td class="td-date">${formatDate(row.match_date)}</td>
      <td class="td-map">${escHtml(row.map_name)}</td>
      <td><span class="td-region ${regionClass}">${escHtml(row.region ?? "?")}</span></td>
      <td class="td-notes">
        <textarea
          class="note-field"
          data-id="${row.id}"
          rows="1"
          placeholder="add note…"
        >${escHtml(row.notes)}</textarea>
      </td>
    </tr>
  `}).join("");

  // Auto-resize textareas
  tbody.querySelectorAll(".note-field").forEach(ta => {
    autoResize(ta);
    ta.addEventListener("input", () => autoResize(ta));
  });
}

function autoResize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

// ── Note saving (debounced) ──────────────────────────────────────────────────
document.addEventListener("input", e => {
  const ta = e.target;
  if (!ta.classList.contains("note-field")) return;

  const id    = ta.dataset.id;
  const notes = ta.value;

  // update local cache
  const row = allRows.find(r => String(r.id) === String(id));
  if (row) row.notes = notes;

  ta.classList.add("saving");
  ta.classList.remove("saved");

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await saveNote(id, notes);
      ta.classList.remove("saving");
      ta.classList.add("saved");
      flashSaved();
    } catch (err) {
      console.error("Save error:", err);
      ta.classList.remove("saving");
    }
  }, 800); // wait 800ms after last keystroke
});

function flashSaved() {
  const el = document.getElementById("save-status");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

// ── Search ───────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  render(e.target.value);
});

// ── Region filter ─────────────────────────────────────────────────────────────
document.getElementById("region-filter").addEventListener("change", () => {
  render(document.getElementById("search").value);
});

// ── Sort ─────────────────────────────────────────────────────────────────────
document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortCol = col;
      sortDir = col === "match_date" ? "desc" : "asc";
    }
    document.querySelectorAll("th").forEach(t => t.classList.remove("sort-asc","sort-desc"));
    th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
    render(document.getElementById("search").value);
  });
});

// ── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  try {
    allRows = await fetchAll();
    render();

    // Show the most recent created_at timestamp as "last synced"
    if (allRows.length > 0) {
      const latest = allRows.reduce((best, r) =>
        r.created_at > best ? r.created_at : best, allRows[0].created_at);
      const d = new Date(latest);
      const label = d.toLocaleDateString("en-US", {
        year: "numeric", month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit"
      });
      document.querySelector("#last-synced span").textContent = label;
    }
  } catch (err) {
    document.getElementById("state").innerHTML =
      `<div class="big">CONNECTION LOST</div>Could not load data: ${escHtml(err.message)}`;
  }
})();
</script>
</body>
</html>
