<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment Moderation - Martian Buddy Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 50px auto;
        padding: 20px;
        background-color: #1a1a1a;
        color: #f0f0f0;
      }
      h1 {
        color: #ff4444;
      }
      .comment-card {
        background-color: #2a2a2a;
        padding: 20px;
        margin: 20px 0;
        border-left: 4px solid #ff4444;
      }
      .comment-meta {
        color: #999;
        font-size: 0.9em;
        margin-bottom: 10px;
      }
      .comment-text {
        margin: 15px 0;
        padding: 10px;
        background-color: #1a1a1a;
      }
      button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }
      .approve-btn {
        background-color: #44ff44;
        color: #000;
      }
      .delete-btn {
        background-color: #ff4444;
        color: #fff;
      }
      .approved {
        opacity: 0.5;
        border-left-color: #44ff44;
      }
      #status {
        color: #66ccff;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>🛡️ Comment Moderation Dashboard</h1>
    <p><a href="../index.html" style="color: #66ccff">← Back to Home</a></p>

    <div id="status">Loading comments...</div>
    <div id="comments-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://ewztgzyqrgvhgmbaldgn.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3enRnenlxcmd2aGdtYmFsZGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNjEwMjAsImV4cCI6MjA4MzczNzAyMH0.es4df8tu_c7sAKmjSHLD-SigOArXoZhB7JqQ27q0ouY";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      async function loadAllComments() {
        const { data, error } = await supabaseClient
          .from("comments")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          document.getElementById("status").textContent =
            "Error loading comments: " + error.message;
          return;
        }

        displayComments(data);
      }

      function displayComments(comments) {
        const container = document.getElementById("comments-container");

        if (comments.length === 0) {
          document.getElementById("status").textContent = "No comments yet.";
          return;
        }

        document.getElementById(
          "status"
        ).textContent = `Total comments: ${comments.length}`;

        container.innerHTML = comments
          .map(
            (comment) => `
                <div class="comment-card ${
                  comment.approved ? "approved" : ""
                }" id="comment-${comment.id}">
                    <div class="comment-meta">
                        <strong>From:</strong> ${escapeHtml(
                          comment.author_name
                        )} | 
                        <strong>Guide:</strong> ${escapeHtml(
                          comment.guide_page
                        )} | 
                        <strong>Date:</strong> ${new Date(
                          comment.created_at
                        ).toLocaleString()} |
                        <strong>Status:</strong> ${
                          comment.approved ? "✅ Approved" : "⏳ Pending"
                        }
                    </div>
                    <div class="comment-text">
                        ${escapeHtml(comment.comment_text)}
                    </div>
                    <div>
                        ${
                          !comment.approved
                            ? `<button class="approve-btn" onclick="approveComment(${comment.id})">✓ Approve</button>`
                            : ""
                        }
                        <button class="delete-btn" onclick="deleteComment(${
                          comment.id
                        })">✗ Delete</button>
                    </div>
                </div>
            `
          )
          .join("");
      }

      async function approveComment(id) {
        const { error } = await supabaseClient
          .from("comments")
          .update({ approved: true })
          .eq("id", id);

        if (error) {
          alert("Error approving comment: " + error.message);
          return;
        }

        alert("Comment approved!");
        loadAllComments(); // Reload to show updated status
      }

      async function deleteComment(id) {
        if (!confirm("Are you sure you want to delete this comment?")) {
          return;
        }

        const { error } = await supabaseClient
          .from("comments")
          .delete()
          .eq("id", id);

        if (error) {
          alert("Error deleting comment: " + error.message);
          return;
        }

        alert("Comment deleted!");
        loadAllComments(); // Reload
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Load comments on page load
      loadAllComments();
    </script>
  </body>
</html>
